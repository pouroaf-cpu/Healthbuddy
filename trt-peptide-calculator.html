<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Testosterone & TRT Dose Calculator — Free Online Tool</title>
<meta name="description" content="Calculate your testosterone or TRT dosage based on vial concentration, weekly dose, and injection schedule. Instant results with clear syringe visuals.">
  <link rel="canonical" href="https://www.injectbuddy.com/trt-peptide-calculator" />
  <meta property="og:title" content="TRT/Peptide Dosage Calculator — Inject Buddy" />
  <meta property="og:description" content="Compute exact mL per injection from vial concentration and weekly dose. Visual insulin-style syringe fills in real-time." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.injectbuddy.com/trt-peptide-calculator.html" />
  <meta property="og:site_name" content="Inject Buddy" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <style>.form-container{max-width:980px;margin:24px auto;padding:0 12px}</style>
</head>
<body>
<!-- InjectBuddy Header (mobile + desktop) -->
<header class="ib-header">
  <div class="ib-nav">
    <a class="ib-brand" href="/">InjectBuddy</a>

    <button class="ib-toggle" aria-expanded="false" aria-controls="ib-navlinks" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="ib-navlinks" class="ib-links" role="navigation">
<a href="/" class="ib-link">Home</a>
<a href="/about.html" class="ib-link">About</a>
<a href="/trt-peptide-calculator.html" class="ib-link active">Calculator</a>
<a href="/questionnaire.html" class="ib-link">Questionnaire</a>
<a href="/faq.html" class="ib-link">FAQ</a>
<a href="/contact.html" class="ib-link">Contact</a>
<a href="/privacy.html" class="ib-link">Privacy</a>
    </nav>
  </div>
</header>

<style>
/* ===== InjectBuddy Header Styles ===== */
.ib-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e6eef0}
.ib-nav{max-width:1080px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ib-brand{font-weight:800;text-decoration:none;color:#0b1220;font-size:18px}
.ib-brand:hover{opacity:.9}

.ib-links{display:flex;gap:16px}
.ib-link{color:#0b1220;text-decoration:none;padding:8px 10px;border-radius:8px}
.ib-link:hover{background:#f2fbfb}

.ib-toggle{display:none;flex-direction:column;gap:4px;background:transparent;border:0;padding:8px;border-radius:8px;cursor:pointer}
.ib-toggle span{width:24px;height:2px;background:#0b1220;display:block}

/* Mobile */
@media (max-width:768px){
  .ib-toggle{display:flex}
  .ib-links{
    position:absolute;left:0;right:0;top:56px;display:none;flex-direction:column;
    background:#fff;border-bottom:1px solid #e6eef0;padding:10px 14px;gap:8px
  }
  .ib-links.show{display:flex}
  .ib-link{padding:12px;border-radius:10px}
  .ib-nav{padding:10px 12px}
}

/* Optional: highlight the current page by adding "active" to that link */
.ib-link.active{background:#e6f7f7;border:1px solid #cdeeee}
</style>

<script>
  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);

  // Header toggle + sticky offset var
  (function(){
    const header = document.getElementById('siteHeader');
    const btn = document.querySelector('.ib-toggle');
    const nav = document.getElementById('ib-navlinks');
    const setHeaderH = () => document.documentElement.style.setProperty('--header-h', (header?.offsetHeight || 56) + 'px');
    setHeaderH(); window.addEventListener('resize', setHeaderH);

    if (!btn || !nav) return;
    btn.addEventListener('click', ()=>{
      const open = nav.classList.toggle('show');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.querySelectorAll('a').forEach(a=>{
      a.addEventListener('click', ()=>{
        if (nav.classList.contains('show')) {
          nav.classList.remove('show');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    });
  })();

  // Paint filled portion of range track (WebKit/Chromium). CSS uses var(--val).
  function paintRange(el){
    if(!el) return;
    const min = +el.min || 0, max = +el.max || 100, val = +el.value || 0;
    const pct = ((val - min) * 100) / (max - min);
    el.style.setProperty('--val', pct + '%');
  }

  // ---------- State ----------
  let currentSyringeMl = 1; // 1 | 3

  // Barrel refs
  let barrelWrap=null, fillEl=null;

  // ---------- Syringe UI ----------
  function setInactive(){
    if(!barrelWrap) return;
    barrelWrap.classList.remove('active'); barrelWrap.classList.add('inactive');
    if (fillEl) fillEl.style.height='0px';
  }
  function setActive(){
    if(!barrelWrap) return;
    barrelWrap.classList.remove('inactive'); barrelWrap.classList.add('active');
  }

  // Ticks inside the barrel
  function buildTicks(maxMl){
    const ticks=$('ticks'); if(!ticks) return;
    ticks.innerHTML='';
    const step=(maxMl<=1)?0.1:0.5;
    const barrelPx=200; // must match CSS barrel height
    for(let v=0; v<=maxMl+1e-9; v+=step){
      const row=document.createElement('div');
      row.className='tick-row';
      row.style.bottom=(v/maxMl)*barrelPx+'px';
      row.innerHTML='<span>'+v.toFixed(1)+' mL</span>';
      ticks.appendChild(row);
    }
  }

  // Trigger a brief 'slosh' animation that fades to a clean line
  let sloshTimer = null;
  function kickSlosh(){
    if(!fillEl) return;
    fillEl.classList.remove('slosh');       // restart animation
    void fillEl.offsetWidth;                // force reflow
    fillEl.classList.add('slosh');
    clearTimeout(sloshTimer);
sloshTimer = setTimeout(()=> fillEl.classList.remove('slosh'), (1400*3)+1000+50);

  }

  function setSyringeUI(volumeMl, syringeMaxMl){
    const vol = Math.max(0, Math.min(volumeMl, syringeMaxMl));
    const ratio = Math.min(vol / syringeMaxMl, 1);
    const px = ratio * 200;            // 200px = barrel height in CSS
    if (fillEl) {
      fillEl.style.height = px + 'px';
      if (px > 0) kickSlosh();
    }
    buildTicks(syringeMaxMl);
    if(vol>0) setActive(); else setInactive();
  }

  // ---------- Debounce ----------
  let __computeTimer = null;
  function debounce(fn, delay=80){
    return (...args)=>{
      clearTimeout(__computeTimer);
      __computeTimer = setTimeout(()=>fn(...args), delay);
    };
  }
  const computeDebounced = debounce(compute, 80);

  // ---------- Segmented control (syringe size) ----------
  function setSyringe(ml){
    currentSyringeMl = ml;
    const group = $('syringeToggle');
    const btns = group.querySelectorAll('.seg-btn');
    btns.forEach(b=> b.setAttribute('aria-checked', String(Number(b.dataset.ml) === ml)));
    buildTicks(currentSyringeMl);
    computeDebounced();
    try{ localStorage.setItem('hb_syr_ml', String(ml)); }catch(e){}
  }

  function initSyringeToggle(){
    const group = $('syringeToggle');
    const btns = group.querySelectorAll('.seg-btn');
    group.addEventListener('click', (e)=>{
      const btn = e.target.closest('.seg-btn'); if(!btn) return;
      setSyringe(Number(btn.dataset.ml));
    });
    group.addEventListener('keydown', (e)=>{
      if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
      e.preventDefault();
      const arr=[...btns];
      const current = arr.findIndex(b=>b.getAttribute('aria-checked')==='true');
      const next = current===0 ? 1 : 0;
      setSyringe(Number(arr[next].dataset.ml));
      arr[next].focus();
    });
    const saved = (()=>{ try{ return Number(localStorage.getItem('hb_syr_ml')); }catch(e){ return NaN; } })();
    setSyringe(saved===3 ? 3 : 1);
  }

  // ---------- Live sliders + chips ----------
  function initLiveSliders(){
    const concSlider   = $('conc-slider');
    const weeklySlider = $('weekly-slider');
    const countSlider  = $('count-slider');

    const lrConc   = $('lr-conc');
    const lrWeekly = $('lr-weekly');
    const lrCount  = $('lr-count');

    if(concSlider && lrConc){
      const setConc = (v)=>{
        let n = parseFloat(v);
        if(!isFinite(n)) n = 200;
        n = Math.min(+concSlider.max, Math.max(+concSlider.min, Math.round(n / 10) * 10));
        concSlider.value = n;
        lrConc.textContent = n.toFixed(0) + ' mg/mL';
        paintRange(concSlider);
        computeDebounced();
      };
      concSlider.addEventListener('input', ()=> setConc(concSlider.value));
      setConc(concSlider.value || 200);
    }

    if(weeklySlider && lrWeekly){
      const setWeekly = (v)=>{
        let n = parseFloat(v);
        if (!isFinite(n)) n = 140;
        n = Math.min(+weeklySlider.max, Math.max(+weeklySlider.min, Math.round(n / 10) * 10));
        weeklySlider.value = n;
        lrWeekly.textContent = n.toFixed(0) + ' mg/week';
        paintRange(weeklySlider);
        computeDebounced();
      };
      weeklySlider.addEventListener('input', ()=> setWeekly(weeklySlider.value));
      setWeekly(weeklySlider.value || 140);
    }

    if(countSlider && lrCount){
      const setCount = (v)=>{
        let n = Math.round(parseFloat(v)||2);
        n = Math.min(+countSlider.max, Math.max(+countSlider.min, n));
        countSlider.value = n;
        lrCount.textContent = n + ' / week';
        paintRange(countSlider);
        computeDebounced();
      };
      countSlider.addEventListener('input', ()=> setCount(countSlider.value));
      setCount(countSlider.value || 2);
    }
  }

  // ---------- Compute ----------
  function compute(){
    const conc       = parseFloat(($('conc-slider')||{}).value);
    const weekly     = parseFloat(($('weekly-slider')||{}).value);
    const injPerWeek = parseFloat(($('count-slider')||{}).value);

    const valid = (conc > 0) && (weekly > 0) && (injPerWeek > 0);
    if (!valid){
      const k1=$('kpi_inj'), k2=$('kpi_dose'), k3=$('kpi_ml');
      if(k1) k1.textContent='—';
      if(k2) k2.textContent='—';
      if(k3) k3.textContent='—';
      setSyringeUI(0, currentSyringeMl);
      const warn = $('warn'); if (warn) { warn.hidden = true; warn.textContent = ''; }
      return;
    }

    const dosePerInj   = weekly / injPerWeek;   // mg
    const volPerInj_ml = dosePerInj / conc;     // mL

    $('kpi_inj').textContent  = injPerWeek.toFixed(2);
    $('kpi_dose').textContent = dosePerInj.toFixed(2) + ' mg';
    $('kpi_ml').textContent   = volPerInj_ml.toFixed(3);

    setSyringeUI(volPerInj_ml, currentSyringeMl);

    const warn = $('warn');
    if (warn){
      if (volPerInj_ml > currentSyringeMl){
        warn.hidden=false;
        warn.textContent='Volume exceeds syringe capacity. Choose a larger syringe or adjust schedule.';
      } else {
        warn.hidden=true; warn.textContent='';
      }
    }

    try{
      localStorage.setItem('hb_last_calc', JSON.stringify({
        inj: injPerWeek,
        dose: dosePerInj,
        unit: 'mg',
        ml:  volPerInj_ml,
        syr: currentSyringeMl
      }));
    }catch(e){}
  }

  // ---------- Init ----------
  document.addEventListener('DOMContentLoaded', ()=>{
    // cache elements
    barrelWrap = document.querySelector('.barrel-wrap');
    fillEl     = $('fill');

    // toggles, sliders, auto-calc
    initSyringeToggle();
    initLiveSliders();

    // initial render
    buildTicks(currentSyringeMl);
    compute(); // first pass

    // ensure track fill paints on load & subsequent changes
    ['conc-slider','weekly-slider','count-slider'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      paintRange(el);
      el.addEventListener('input', ()=>paintRange(el));
      el.addEventListener('change', ()=>paintRange(el));
    });
  });
</script>
</body>
</html>
