<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auth Callback | InjectBuddy</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#020617;color:#e5e7eb;padding:24px}
    .card{width:min(720px,100%);padding:22px;border-radius:16px;background:linear-gradient(180deg,#0b1220,#070d18);border:1px solid #1f2937;box-shadow:0 18px 50px rgba(15,23,42,.75)}
    h1{margin:0 0 8px;font-size:18px}
    .muted{color:#94a3b8;font-size:13px;line-height:1.45}
    pre{margin:12px 0 0;padding:12px;border-radius:12px;background:rgba(2,6,23,.55);border:1px solid #1f2937;color:#cbd5f5;white-space:pre-wrap;word-break:break-word;font-size:12px}
    .btn{margin-top:14px;background:transparent;border:1px solid #1f2937;color:#e5e7eb;padding:10px 14px;border-radius:12px;cursor:pointer}
    .btn:hover{border-color:#00a3b0}
  </style>
</head>
<body>
  <div class="card">
    <h1>Finishing sign-in…</h1>
    <div class="muted" id="msg">Working…</div>
    <pre id="dbg">Loading…</pre>
    <button class="btn" id="goDash" style="display:none">Go to dashboard</button>
    <button class="btn" id="goLogin" style="display:none">Back to login</button>
  </div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const msgEl = document.getElementById("msg");
  const dbgEl = document.getElementById("dbg");
  const goLogin = document.getElementById("goLogin");

  const msg = (t) => (msgEl.textContent = t);
  const dbg = (t) => (dbgEl.textContent = t);

  goLogin.onclick = () => location.replace("/login.html");

  const supabase = createClient(
    "https://psrtdoglooijxzeyhmpc.supabase.co",
    "sb_publishable_Ta_almUqr3QTPpWQA6Uicw_IYhwLY0S",
    {
      auth: {
        flowType: "pkce",
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true   // ✅ let supabase handle the code exchange
      }
    }
  );

  msg("Finalising sign-in…");
  dbg("URL:\n" + location.href);

  // Give the library a tick to process the URL
  setTimeout(async () => {
    const { data, error } = await supabase.auth.getSession();

    const keys = Object.keys(localStorage || {}).filter(k =>
      k.toLowerCase().includes("supabase") || k.toLowerCase().includes("pkce") || k.toLowerCase().includes("code") || k.startsWith("ib_")
    );

    dbg(dbgEl.textContent + "\n\nLOCALSTORAGE KEYS:\n" + (keys.length ? keys.join("\n") : "(none)"));

    if (error) {
      msg("Login failed.");
      dbg(dbgEl.textContent + "\n\nERROR:\n" + error.message);
      goLogin.style.display = "inline-block";
      return;
    }

    if (!data.session) {
      msg("Login failed: no session created.");
      goLogin.style.display = "inline-block";
      return;
    }

    // Clean URL
    history.replaceState({}, document.title, "/auth/callback.html");

    msg("Success. Redirecting…");
    location.replace("/dashboard.html");
  }, 250);
</script>

</body>
</html>
