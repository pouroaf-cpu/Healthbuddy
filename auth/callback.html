<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signing in… | InjectBuddy</title>
  <meta name="robots" content="noindex,nofollow" />

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:#020617;
      color:#e5e7eb;
    }
    .card{
      width:min(520px,100%);
      padding:28px;
      border-radius:16px;
      background:linear-gradient(180deg,#0b1220,#070d18);
      border:1px solid #1f2937;
      box-shadow:0 18px 50px rgba(15,23,42,.75);
    }
    h1{
      margin:0 0 8px;
      font-size:20px;
    }
    p{
      margin:0;
      color:#94a3b8;
      font-size:14px;
    }
    .spinner{
      margin-top:16px;
      width:36px;
      height:36px;
      border-radius:50%;
      border:3px solid #1f2937;
      border-top-color:#00a3b0;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <h1>Signing you in</h1>
    <p id="msg">Finalising secure login…</p>
    <div class="spinner"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const msg = (t) => document.getElementById("msg").textContent = t;

    const supabase = createClient(
      "https://psrtdoglooijxzeyhmpc.supabase.co",
      "sb_publishable_Ta_almUqr3QTPpWQA6Uicw_IYhwLY0S",
      { auth: { flowType: "pkce" } }
    );

    try {
      const code = new URLSearchParams(window.location.search).get("code");

      if (code) {
        msg("Exchanging login token…");
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw error;
      }

      // Remove any tokens / code from URL
      history.replaceState({}, document.title, "/auth/callback.html");

      const { data } = await supabase.auth.getSession();
      window.location.replace(data.session ? "/dashboard.html" : "/login.html");
    } catch {
      msg("Login failed. Redirecting…");
      setTimeout(() => window.location.replace("/login.html"), 1200);
    }
  </script>
</body>
</html>
