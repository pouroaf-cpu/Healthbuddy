<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Peptide Reconstitution Calculator</title>
  <meta name="description" content="Peptide reconstitution and dosage calculator. Enter mg and mL to calculate mg/mL strength, dosing volume, and syringe visuals.">

  <link rel="icon" href="/assets/favicon.svg" />

  <style>

/* ----------------------------------------------------
   ROOT + GLOBAL
---------------------------------------------------- */
:root{
  --teal:#009395;
  --teal-900:#004c4d;
  --ink:#0f172a;
  --muted:#475569;
  --bg:#ffffff;
  --cta:#00b2b5;
  --cta-hover:#00c7ca;
  --border:#e2e8f0;
  --shadow:0 10px 30px rgba(2,6,23,.06);
  --oil1:#fbbf24;
  --oil2:#fde68a;
  --info-bg:#f0f9ff;
  --info-bd:#bae6fd;
  --info-ink:#075985;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
a{text-decoration:none;color:inherit}

/* ----------------------------------------------------
   EMBED CHROME BAR
---------------------------------------------------- */
.ib-embed-top{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:6px 10px 0;
}
.ib-embed-tabs{
  display:flex;
  gap:6px;
}
.ib-embed-tab{
  padding:8px 16px 7px;
  background:#f1f5f9;
  border:1px solid var(--border);
  border-bottom:0;
  border-radius:10px 10px 0 0;
  font-size:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
}
.ib-embed-tab.active{
  background:#ffffff;
  border-bottom:1px solid #ffffff;
}
.ib-embed-tab .dot{
  width:8px;
  height:8px;
  border-radius:999px;
  background:#9ca3af;
}
.ib-embed-tab.active .dot{
  background:var(--teal);
}

/* ----------------------------------------------------
   LAYOUT
---------------------------------------------------- */
.container{
  max-width:1100px;
  margin:0 auto;
  padding:20px;
}

.card{
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:20px;
}

/* Label + chip layout */
.full{
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-areas:
    "label chip"
    "input input";
  gap:8px;
}
.full > label{
  grid-area:label;
  font-weight:700;
  margin:0;
}
.full > .live-reads{
  grid-area:chip;
}
.full > input,
.full > input[type="range"]{
  grid-area:input;
}

/* ----------------------------------------------------
   INPUTS / SLIDERS
---------------------------------------------------- */
input{
  border:1px solid var(--border);
  padding:10px 12px;
  border-radius:12px;
  font:inherit;
  background:white;
}
input:focus-visible{
  outline:0;
  border-color:var(--cta);
  box-shadow:0 0 0 3px rgba(0,147,149,.3);
}

/* Slider */
input[type="range"]{
  appearance:none;
  width:100%;
  height:8px;
  background:#e2e8f0;
  border-radius:999px;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:8px;
  background:linear-gradient(
    to right,
    var(--cta) 0%,
    var(--cta) var(--val,50%),
    #e2e8f0 var(--val,50%),
    #e2e8f0 100%
  );
  border-radius:999px;
}
input[type="range"]::-webkit-slider-thumb{
  appearance:none;
  width:24px;
  height:24px;
  background:var(--cta);
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
  margin-top:-8px;
}

/* ----------------------------------------------------
   TOGGLE BUTTON GROUPS
---------------------------------------------------- */
.seg-toggle{
  display:inline-flex;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.seg-btn{
  padding:8px 12px;
  background:white;
  border:0;
  font-weight:700;
  cursor:pointer;
}
.seg-btn[aria-checked="true"]{
  background:#ecfeff;
  color:#065f5b;
}

/* ----------------------------------------------------
   LIVE CHIP
---------------------------------------------------- */
.live-chip{
  padding:6px 10px;
  border-radius:10px;
  background:#fff;
  border:1px solid var(--border);
  font-weight:700;
}

/* ----------------------------------------------------
   SYRINGE + VIAL VISUALS
---------------------------------------------------- */
.syringe-wrap{
  margin-top:20px;
}
.syringe-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  background:white;
  box-shadow:var(--shadow);
}
.syringe-head{
  font-size:0.9rem;
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

/* ----------------------------------------------------
   FAQ (optional)
---------------------------------------------------- */
.faq summary{
  font-weight:700;
  cursor:pointer;
}
.faq .card{
  margin:10px 0;
}

/* Hidden helper */
.is-hidden{display:none!important;}

  </style>
</head>
<body>

<!-- Chrome-style tab (NO NAV) -->
<div class="ib-embed-top">
  <div class="ib-embed-tabs">
    <div class="ib-embed-tab active"><span class="dot"></span> Peptide Calculator</div>
  </div>
</div>

<main class="container">

  <section class="card">
    <h2 style="margin-top:0">Peptide Reconstitution Calculator</h2>

    <div class="calc-wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <!-- LEFT SIDE -->
      <div>

        <!-- MG -->
        <div class="full">
          <label>Peptide in vial (mg)</label>
          <div class="live-reads"><div class="live-chip" id="lr-mg">5 mg</div></div>
          <input id="pepMg" type="number" step="0.1" value="5">
        </div>

        <!-- ML -->
        <div class="full">
          <label>Bacteriostatic water (mL)</label>
          <div class="live-reads"><div class="live-chip" id="lr-ml">2 mL</div></div>
          <input id="bacMl-slider" type="range" min="1" max="30" value="2">
        </div>

        <!-- Strength -->
        <div class="full">
          <label>Vial strength</label>
          <div class="live-reads"><div class="live-chip" id="lr-strength">—</div></div>
          <div></div>
        </div>

        <!-- Weekly MG -->
        <div class="full">
          <label>Desired mg per week</label>
          <div class="live-reads"><div class="live-chip" id="lr-weeklyMg">1 mg/week</div></div>
          <input id="weeklyMg-input" type="number" step="0.1" value="1">
        </div>

        <!-- Mode -->
        <div class="full" style="align-items:center;">
          <label>Dose Mode</label>
          <div class="seg-toggle" id="modeToggle">
            <button type="button" class="seg-btn" role="radio" data-mode="perWeek" aria-checked="true">Per week</button>
            <button type="button" class="seg-btn" role="radio" data-mode="everyNDays" aria-checked="false">Every N days</button>
          </div>
        </div>

        <!-- Per week -->
        <div class="full" id="perWeek-wrap">
          <label>Injections per week</label>
          <div class="live-reads"><div class="live-chip" id="lr-injCount">3 / week</div></div>
          <input id="injCount-slider" type="range" min="1" max="7" value="3">
        </div>

        <!-- Every N days -->
        <div class="full is-hidden" id="everyN-wrap">
          <label>Every N days</label>
          <div class="live-reads"><div class="live-chip" id="lr-ndays">3 days</div></div>
          <input id="ndays-slider" type="range" min="1" max="14" value="3">
        </div>

        <!-- Syringe -->
        <div class="full">
          <label>Syringe Size</label>
          <div class="seg-toggle" id="syringeToggle">
            <button class="seg-btn" data-ml="0.3">0.3 mL</button>
            <button class="seg-btn" data-ml="0.5">0.5 mL</button>
            <button class="seg-btn" data-ml="1" aria-checked="true">1 mL</button>
            <button class="seg-btn" data-ml="3">3 mL</button>
          </div>
        </div>

      </div>

      <!-- RIGHT SIDE: Syringe -->
      <div>
        <div class="syringe-wrap">
          <div class="syringe-card">
            <div class="syringe-head">
              <div><b id="syrVol">0.00 mL</b></div>
              <div><b id="syrMode">Insulin — 1 mL</b></div>
            </div>

            <svg id="syringe-svg" viewBox="0 0 1280 240" style="width:100%;height:auto">
              <!-- simplified syringe body -->
              <rect x="200" y="80" width="900" height="60" fill="#fff" stroke="#ccc"/>
              <clipPath id="clipFill"><rect x="200" y="80" width="900" height="60"/></clipPath>
              <rect id="fill" x="200" y="80" width="0" height="60" fill="url(#gradOil)" clip-path="url(#clipFill)"/>

              <defs>
                <linearGradient id="gradOil">
                  <stop offset="0" stop-color="var(--oil1)"/>
                  <stop offset="1" stop-color="var(--oil2)"/>
                </linearGradient>
              </defs>
            </svg>

            <div id="warn" style="color:#9a3412;margin-top:10px;display:none;font-size:0.85rem"></div>
          </div>
        </div>
      </div>

    </div>
  </section>

</main>


<!-- ----------------------------------------------------
     JAVASCRIPT (PEPTIDE LOGIC)
---------------------------------------------------- -->

<script>

const $ = id => document.getElementById(id);

function paintRange(el){
  const min = +el.min, max = +el.max, val = +el.value;
  const pct = ((val - min) * 100) / (max - min);
  el.style.setProperty('--val', pct + '%');
}

/* MODE TOGGLE */
window.__mode = "perWeek";

/* Current syringe size */
let syringeCapMl = 1;

/* Set syringe capacity */
function setSyringe(ml){
  syringeCapMl = +ml;
  const btns = syringeToggle.querySelectorAll(".seg-btn");
  btns.forEach(b => b.setAttribute("aria-checked", b.dataset.ml == ml));
  updateSyringeFill(0);
  compute();
}

/* Update fill width */
function updateSyringeFill(vol){
  const maxWidth = 900; /* matches SVG */
  const px = Math.max(0, Math.min(maxWidth, (vol / syringeCapMl) * maxWidth));
  $("fill").setAttribute("width", px);
  $("syrVol").textContent = vol.toFixed(3) + " mL";
  $("syrMode").textContent = (syringeCapMl===3 ? "3 mL" : `Insulin — ${syringeCapMl} mL`);
}

/* Main calculation */
function compute(){

  const mg = +$("pepMg").value || 0;
  const ml = +$("bacMl-slider").value || 0;

  $("lr-mg").textContent = mg + " mg";
  $("lr-ml").textContent = ml + " mL";
  paintRange($("bacMl-slider"));

  if(mg <= 0 || ml <= 0){
    $("lr-strength").textContent = "—";
    updateSyringeFill(0);
    return;
  }

  const mgPerMl = mg / ml;
  $("lr-strength").textContent = mgPerMl.toFixed(3) + " mg/mL";

  const weeklyMg = +$("weeklyMg-input").value || 0;
  $("lr-weeklyMg").textContent = weeklyMg + " mg/week";

  if(weeklyMg <= 0){
    updateSyringeFill(0);
    return;
  }

  let injPerWeek = 0;

  if(window.__mode === "perWeek"){
    injPerWeek = +$("injCount-slider").value;
    $("lr-injCount").textContent = injPerWeek + " / week";
    paintRange($("injCount-slider"));
  } else {
    const N = +$("ndays-slider").value;
    $("lr-ndays").textContent = N + " days";
    injPerWeek = 7 / N;
    paintRange($("ndays-slider"));
  }

  if(injPerWeek <= 0){
    updateSyringeFill(0);
    return;
  }

  const doseMg = weeklyMg / injPerWeek;
  const doseMl = doseMg / mgPerMl;

  updateSyringeFill(doseMl);

  if(doseMl > syringeCapMl){
    $("warn").style.display="block";
    $("warn").textContent = "Volume exceeds syringe capacity.";
  } else {
    $("warn").style.display="none";
  }
}


/* EVENT BINDINGS */
document.addEventListener("DOMContentLoaded", ()=>{

  $("modeToggle").addEventListener("click", e=>{
    const b = e.target.closest(".seg-btn");
    if(!b) return;
    window.__mode = b.dataset.mode;
    $("perWeek-wrap").classList.toggle("is-hidden", window.__mode!=="perWeek");
    $("everyN-wrap").classList.toggle("is-hidden", window.__mode==="perWeek");
    compute();
  });

  $("syringeToggle").addEventListener("click", e=>{
    const b = e.target.closest(".seg-btn");
    if(!b) return;
    setSyringe(+b.dataset.ml);
  });

  ["pepMg","weeklyMg-input"].forEach(id=>{
    $(id).addEventListener("input", compute);
  });

  ["bacMl-slider","injCount-slider","ndays-slider"].forEach(id=>{
    const el=$(id); paintRange(el);
    el.addEventListener("input", compute);
  });

  compute();
});

</script>

</body>
</html>
