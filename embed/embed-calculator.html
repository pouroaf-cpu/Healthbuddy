<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4EGGZW9P14"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4EGGZW9P14');

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>InjectBuddy — TRT & Peptide Calculators (Embed Widget)</title>
  <meta name="description" content="Embed-ready widget with both InjectBuddy TRT dosage calculator and peptide dosage & reconstitution calculator, switchable via a clean toggle." />
  <link rel="canonical" href="https://www.injectbuddy.com/embed/embed-calculator.html" />
  <meta property="og:title" content="InjectBuddy — TRT & Peptide Calculators (Embed Widget)" />
  <meta property="og:description" content="Single embed widget that lets users switch between TRT dosage and peptide dosage calculators." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.injectbuddy.com/embed/embed-calculator.html" />
  <meta property="og:site_name" content="InjectBuddy" />
  <link rel="icon" href="/assets/favicon.svg" />

  <style>
    :root{
      --teal:#009395;
      --teal-900:#004c4d;
      --ink:#0f172a;
      --muted:#6b7280;
      --bg:#f6f8f8;

      --cta:#00b2b5;
      --cta-hover:#00c7ca;
      --cta-dark:#036d6f;
      --ring:rgba(0,147,149,.35);
      --border:#e2e8f0;
      --shadow:0 10px 30px rgba(2,6,23,.06);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:transparent; /* allow host page background to show */
      color:var(--ink);
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    .ib-embed-shell{
      max-width:1120px;
      margin:0 auto;
      background:#ffffff;
      border:1px solid rgba(15,23,42,.06);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:12px 12px 10px;
    }

    @media (max-width:640px){
      .ib-embed-shell{
        border-radius:12px;
        padding:8px 8px 10px;
      }
    }

    .ib-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
    }

    .ib-brand{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:700;
      color:var(--teal-900);
      letter-spacing:0.01em;
      font-size:.95rem;
    }

    .ib-logo-mark{
      width:28px;
      height:28px;
      border-radius:10px;
      background:var(--teal);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:800;
      font-size:.9rem;
      box-shadow:0 4px 10px rgba(0,0,0,.12);
    }

    .ib-tagline{
      font-size:.8rem;
      color:var(--muted);
    }

    /* Toggle */
    .ib-toggle-wrap{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      margin-bottom:8px;
    }

    .seg-toggle{
      display:inline-flex;
      padding:2px;
      border-radius:999px;
      background:#e2e8f0;
      border:1px solid var(--border);
      gap:2px;
    }
    .seg-btn{
      flex:1 0 auto;
      padding:6px 12px;
      font-weight:600;
      border:0;
      border-radius:999px;
      background:transparent;
      color:#0f172a;
      cursor:pointer;
      white-space:nowrap;
      font-size:.8rem;
      transition:background-color .15s ease,color .15s ease,box-shadow .15s ease;
    }
    .seg-btn[aria-checked="true"]{
      background:var(--cta);
      color:#fff;
      box-shadow:0 0 0 1px rgba(15,23,42,.06);
    }
    .seg-btn:focus-visible{
      outline:0;
      box-shadow:0 0 0 2px var(--ring);
      border-radius:999px;
    }

    @media (max-width:480px){
      .ib-header{
        flex-direction:column;
        align-items:flex-start;
        gap:4px;
      }
      .ib-toggle-wrap{
        justify-content:flex-start;
      }
      .seg-btn{
        padding:5px 10px;
      }
    }

    /* Iframe area */
    .ib-frame-shell{
      border-radius:12px;
      overflow:hidden;
      border:1px solid #e5e7eb;
      background:#f9fafb;
    }

    .ib-frame{
      width:100%;
      border:0;
      display:none;
      background:#ffffff;
    }
    .ib-frame.active{
      display:block;
    }

    /* Reasonable default height – adjust if your tools are taller/shorter */
    .ib-frame,
    .ib-frame iframe{
      min-height:820px;
    }

    /* Footer */
    .ib-footer{
      margin-top:8px;
      text-align:center;
      font-size:.75rem;
      color:var(--muted);
    }
    .ib-footer a{
      color:var(--teal-900);
      text-decoration:none;
      font-weight:600;
    }
    .ib-footer a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>
  <div class="ib-embed-shell">
    <header class="ib-header">
      <div class="ib-brand">
        <div class="ib-logo-mark">IB</div>
        <div>
          <div>InjectBuddy</div>
          <div class="ib-tagline">TRT & Peptide Calculators</div>
        </div>
      </div>
      <div class="ib-toggle-wrap">
        <div class="seg-toggle" role="radiogroup" aria-label="Calculator selector" id="calcToggle">
          <button type="button" class="seg-btn" role="radio" aria-checked="true" data-target="trt-frame">
            TRT dosage
          </button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-target="pep-frame">
            Peptide dosage
          </button>
        </div>
      </div>
    </header>

    <div class="ib-frame-shell">
      <!-- TRT iframe -->
      <iframe
        id="trt-frame"
        class="ib-frame active"
        src="https://www.injectbuddy.com/embed/calculator.html"
        title="InjectBuddy TRT dosage calculator"
        loading="lazy"
      ></iframe>

      <!-- Peptide iframe -->
      <iframe
        id="pep-frame"
        class="ib-frame"
        src="https://www.injectbuddy.com/embed/peptide-calculator.html"
        title="InjectBuddy peptide dosage & reconstitution calculator"
        loading="lazy"
      ></iframe>
    </div>

    <div class="ib-footer">
      Powered by
      <a href="https://www.injectbuddy.com" target="_blank" rel="noopener noreferrer">
        www.injectbuddy.com
      </a>
    </div>
  </div>

  <script>
    (function(){
      const toggle = document.getElementById('calcToggle');
      const frames = {
        'trt-frame': document.getElementById('trt-frame'),
        'pep-frame': document.getElementById('pep-frame')
      };

      function setActive(targetId){
        Object.values(frames).forEach(f => f.classList.remove('active'));
        if (frames[targetId]) frames[targetId].classList.add('active');

        const btns = toggle.querySelectorAll('.seg-btn');
        btns.forEach(btn => {
          const isActive = btn.dataset.target === targetId;
          btn.setAttribute('aria-checked', String(isActive));
        });

        try {
          localStorage.setItem('ib_embed_calc_tab', targetId);
        } catch(e){}
      }

      toggle.addEventListener('click', e => {
        const btn = e.target.closest('.seg-btn');
        if (!btn) return;
        setActive(btn.dataset.target);
      });

      toggle.addEventListener('keydown', e => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        const btns = Array.from(toggle.querySelectorAll('.seg-btn'));
        const currentIndex = btns.findIndex(b => b.getAttribute('aria-checked') === 'true');
        const nextIndex = e.key === 'ArrowRight'
          ? (currentIndex + 1) % btns.length
          : (currentIndex - 1 + btns.length) % btns.length;
        const target = btns[nextIndex].dataset.target;
        setActive(target);
        btns[nextIndex].focus();
      });

      // Restore last used tab if available
      try{
        const saved = localStorage.getItem('ib_embed_calc_tab');
        if (saved && frames[saved]) setActive(saved);
      }catch(e){}
    })();
  </script>
</body>
</html>
