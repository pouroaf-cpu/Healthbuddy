<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>InjectBuddy — Embedded Calculators</title>
  <meta name="description" content="Embedded InjectBuddy calculators with simple tabs for TRT dosage and peptide reconstitution." />

  <style>
    :root{
      --ink:#0f172a;
      --muted:#64748b;
      --bg:#0b1120;
      --tab-bg:#111827;
      --tab-active:#ffffff;
      --tab-inactive:#e5e7eb;
      --accent:#00b2b5;
      --border:#020617;
    }

    *{box-sizing:border-box;}
    html,body{
      margin:0;
      padding:0;
      background:transparent;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
    }

    .embed-shell{
      max-width:1100px;
      margin:0 auto;
      padding:4px;
    }

    .chrome-window{
      border-radius:16px;
      overflow:hidden;
      background:#020617;
      box-shadow:0 18px 40px rgba(15,23,42,.35);
      border:1px solid var(--border);
    }

    /* Top bar (tabs only) */
    .chrome-top{
      background:var(--bg);
      border-bottom:1px solid var(--border);
      padding-top:4px;
    }

    .chrome-tabs{
      display:flex;
      align-items:flex-end;
      padding:0 8px 2px;
      gap:6px;
    }

    .chrome-tab{
      position:relative;
      border:0;
      background:var(--tab-inactive);
      color:#111827;
      padding:6px 14px 5px;
      border-radius:10px 10px 0 0;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      min-width:120px;
      text-align:left;
      display:flex;
      align-items:center;
      gap:6px;
      box-shadow:0 0 0 rgba(0,0,0,0);
      transition:background-color .12s, box-shadow .12s, color .12s, transform .08s;
    }

    .chrome-tab::before{
      content:"";
      position:absolute;
      left:-6px;
      bottom:0;
      width:12px;
      height:10px;
      background:transparent;
      box-shadow:6px 0 0 0 var(--tab-inactive);
      border-bottom-right-radius:8px;
    }

    .chrome-tab::after{
      content:"";
      position:absolute;
      right:-6px;
      bottom:0;
      width:12px;
      height:10px;
      background:transparent;
      box-shadow:-6px 0 0 0 var(--tab-inactive);
      border-bottom-left-radius:8px;
    }

    .chrome-tab span.dot{
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:999px;
      background:#9ca3af;
    }

    .chrome-tab[aria-selected="true"]{
      background:var(--tab-active);
      color:#111827;
      transform:translateY(1px);
      box-shadow:0 -1px 0 0 var(--tab-active);
    }
    .chrome-tab[aria-selected="true"]::before{
      box-shadow:6px 0 0 0 var(--tab-active);
    }
    .chrome-tab[aria-selected="true"]::after{
      box-shadow:-6px 0 0 0 var(--tab-active);
    }
    .chrome-tab[aria-selected="true"] span.dot{
      background:var(--accent);
    }

    .chrome-tab:hover{
      background:#f3f4f6;
    }

    .chrome-content{
      background:#020617;
      padding:0;
    }

    .tab-panel{
      display:none;
    }
    .tab-panel.is-active{
      display:block;
    }

    iframe.calculator-frame{
      width:100%;
      border:0;
      display:block;
      height:950px; /* adjust if needed */
      background:#020617;
    }

    .embed-footer{
      padding:6px 4px 0;
      font-size:11px;
      color:var(--muted);
      text-align:center;
    }
    .embed-footer a{
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }
    .embed-footer a:hover{
      text-decoration:underline;
    }

    @media (max-width:640px){
      .embed-shell{padding:2px;}
      .chrome-tab{min-width:0;font-size:12px;padding:5px 10px;}
      iframe.calculator-frame{height:1000px;}
    }
  </style>
</head>
<body>

<div class="embed-shell">
  <div class="chrome-window" role="group" aria-label="InjectBuddy calculators">

    <div class="chrome-top">
      <div class="chrome-tabs" role="tablist">
        <button
          class="chrome-tab"
          id="tab-btn-trt"
          role="tab"
          aria-selected="true"
          aria-controls="panel-trt"
          data-target="trt"
        >
          <span class="dot"></span>
          <span>TRT Calculator</span>
        </button>

        <button
          class="chrome-tab"
          id="tab-btn-pep"
          role="tab"
          aria-selected="false"
          aria-controls="panel-pep"
          data-target="pep"
        >
          <span class="dot"></span>
          <span>Peptide Reconstitution</span>
        </button>
      </div>
    </div>

    <div class="chrome-content">
      <!-- TRT CALCULATOR -->
      <div class="tab-panel is-active" id="panel-trt" role="tabpanel" aria-labelledby="tab-btn-trt">
        <iframe
          class="calculator-frame"
          src="https://www.injectbuddy.com/calculator.html"
          loading="lazy"
          title="InjectBuddy TRT Calculator"
        ></iframe>
      </div>

      <!-- PEPTIDE CALCULATOR -->
      <div class="tab-panel" id="panel-pep" role="tabpanel" aria-labelledby="tab-btn-pep">
        <iframe
          class="calculator-frame"
          src="https://www.injectbuddy.com/peptide.html"
          loading="lazy"
          title="InjectBuddy Peptide Reconstitution Calculator"
        ></iframe>
      </div>
    </div>
  </div>

  <div class="embed-footer">
    Powered by
    <a href="https://www.injectbuddy.com" target="_blank" rel="noopener">InjectBuddy</a>
  </div>
</div>

<script>
  (function(){
    const tabButtons = document.querySelectorAll('.chrome-tab');
    const panels = {
      trt: document.getElementById('panel-trt'),
      pep: document.getElementById('panel-pep')
    };

    function setActive(target){
      tabButtons.forEach(btn => {
        const isActive = btn.dataset.target === target;
        btn.setAttribute('aria-selected', String(isActive));
      });

      Object.keys(panels).forEach(key => {
        panels[key].classList.toggle('is-active', key === target);
      });
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        setActive(target);
      });
    });

    // default
    setActive('trt');
  })();
</script>

</body>
</html>
