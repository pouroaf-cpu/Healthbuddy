<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Result — Inject Buddy</title>
  <meta name="description" content="Your dosage and volume per injection." />
  <link rel="canonical" href="https://healthbubbyv1.netlify.app/result.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <style>.form-container{max-width:980px;margin:24px auto;padding:0 12px}</style>
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="/index.html" aria-label="Inject Buddy home">
      <span class="logo-text"><span class="logo-line logo-hormone">Hormone</span><span class="logo-line logo-buddy">Buddy</span></span>
    </a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/trt-peptide-calculator.html">TRT/Peptide Calculator</a>
      <a href="/result.html" aria-current="page">Result</a>
    </div>
  </nav>
</header>

<main class="container form-container">
  <h1>Your Result</h1>

  <div class="kpi">
    <div class="card"><span class="muted">Injections / week</span><b id="r_inj">—</b></div>
    <div class="card"><span class="muted">Dose per injection</span><b id="r_dose">—</b></div>
    <div class="card"><span class="muted">Volume per injection (mL)</span><b id="r_ml">—</b></div>
  </div>

  <!-- Syringe visual -->
  <div class="syringe" aria-label="Syringe visual" style="margin-top:14px">
    <div class="barrel-wrap active">
      <div class="barrel"><div class="fill" id="r_fill"></div></div>
      <div class="ticks" id="r_ticks"></div>
    </div>
    <div>
      <div class="ml-label"><span id="r_mlLabel">0.000</span> mL</div>
      <div class="muted">Syringe: <span id="r_syr">1</span> mL · <span id="r_units">0 units (U-100)</span></div>
      <div id="r_warn" class="warn" hidden></div>
    </div>
  </div>

  <div class="cta" style="margin-top:14px; gap:8px;">
    <a class="button" href="/trt-peptide-calculator.html">Back to Calculator</a>
  </div>

  <p class="muted" style="margin-top:8px">For planning only. Always follow your clinician’s instructions.</p>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const p = new URLSearchParams(location.search);

  // Params or fallback to localStorage
  let inj  = p.get('inj');
  let dose = p.get('dose');
  let unit = p.get('unit'); // 'mg' or 'iu'
  let ml   = p.get('ml');
  let syr  = p.get('syr');

  if (!inj || !dose || !unit || !ml || !syr) {
    try {
      const last = JSON.parse(localStorage.getItem('hb_last_calc') || '{}');
      inj  = inj  ?? last.inj;
      dose = dose ?? last.dose;
      unit = unit ?? last.unit;
      ml   = ml   ?? last.ml;
      syr  = syr  ?? last.syr;
    } catch(e){}
  }

  // KPIs
  if (inj && dose && unit && ml) {
    $('r_inj').textContent  = Number(inj).toFixed(2);
    $('r_dose').textContent = Number(dose).toFixed(2) + ' ' + String(unit).toUpperCase();
    $('r_ml').textContent   = Number(ml).toFixed(3);
  } else {
    const w = $('r_warn');
    w.hidden = false;
    w.textContent = 'No recent calculation found. Go back to the calculator, run a calculation, and you’ll be redirected here.';
  }

  // Syringe
  function buildTicks(maxMl){
    const ticks = $('r_ticks');
    ticks.innerHTML = '';
    const step = (maxMl <= 1) ? 0.1 : 0.5;
    const barrelPx = 200;
    for (let v = 0; v <= maxMl + 1e-9; v += step) {
      const row = document.createElement('div');
      row.className = 'tick-row';
      const y = (v / maxMl) * barrelPx;
      row.style.bottom = y + 'px';
      row.innerHTML = '<span>' + v.toFixed(1) + ' mL</span>';
      ticks.appendChild(row);
    }
  }

  function setSyringeUI(volumeMl, syringeMaxMl) {
    const vol = Math.max(0, Number(volumeMl));
    const max = Math.max(1, Number(syringeMaxMl) || 1);
    const ratio = Math.min(vol / max, 1);
    $('r_fill').style.height = (ratio * 200) + 'px';
    $('r_mlLabel').textContent = vol.toFixed(3);
    $('r_syr').textContent = max.toFixed(0);
    $('r_units').textContent = Math.round(vol * 100) + ' units (U-100)';
    buildTicks(max);

    const warn = $('r_warn');
    if (vol > max) {
      const injectionsNeeded = Math.ceil(vol / max);
      const splitVol = vol / injectionsNeeded;
      warn.hidden = false;
      warn.textContent = `Volume exceeds ${max.toFixed(2)} mL. Consider ${injectionsNeeded} injection(s) of ~${splitVol.toFixed(2)} mL each, a larger syringe, or a higher-concentration vial (with clinician).`;
    } else {
      warn.hidden = true;
      warn.textContent = '';
    }
  }

  // Default syringe if missing
  if (!syr) {
    const v = Number(ml || 0);
    syr = (v > 1 && v <= 3) ? 3 : 1;
  }

  setSyringeUI(ml, syr);
})();
</script>
</body>
</html>
