<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | InjectBuddy</title>
  <meta name="robots" content="noindex,nofollow" />

  <style>
    :root{
      --bg:#020617;
      --card:#0b1220;
      --border:#1f2937;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --cta:#00a3b0;
      --cta2:#036972;
      --danger:#ef4444;
      --shadow: 0 18px 50px rgba(15,23,42,.75);
      --radius:16px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(0,163,176,.20), transparent 55%),
        radial-gradient(900px 500px at 85% 20%, rgba(3,105,114,.18), transparent 55%),
        linear-gradient(180deg, #020617, #020617);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{ width: min(520px, 100%); }

    .card{
      background: linear-gradient(180deg, rgba(11,18,32,.92), rgba(11,18,32,.78));
      border:1px solid rgba(31,41,55,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:28px;
      backdrop-filter: blur(8px);
    }

    .brand{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }

    .logo{
      width:44px;height:44px;border-radius:14px;
      background: radial-gradient(circle at 30% 30%, rgba(0,163,176,.9), rgba(3,105,114,.35));
      border:1px solid rgba(0,163,176,.35);
      box-shadow: 0 10px 25px rgba(0,163,176,.12);
    }

    h1{ margin:0; font-size:22px; letter-spacing:.2px; line-height:1.2; }

    .sub{ margin:10px 0 18px; color:var(--muted); font-size:14px; line-height:1.45; }

    .grid{ display:grid; gap:12px; margin-top:12px; }

    .btn{
      appearance:none;
      border:1px solid rgba(31,41,55,.9);
      background: rgba(2,6,23,.35);
      color:var(--text);
      padding:14px 14px;
      border-radius: 14px;
      cursor:pointer;
      font-weight:650;
      font-size:15px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      transition: transform .06s ease, border-color .15s ease, background .15s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: rgba(0,163,176,.5);
      background: rgba(2,6,23,.55);
    }
    .btn:active{ transform: translateY(0); }

    .pill{
      font-size:12px;
      color:rgba(229,231,235,.9);
      background: linear-gradient(90deg, rgba(0,163,176,.22), rgba(3,105,114,.14));
      border:1px solid rgba(0,163,176,.25);
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .status{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
      min-height:18px;
    }

    .footer{
      margin-top:14px;
      color:rgba(148,163,184,.85);
      font-size:12px;
      line-height:1.45;
    }

    .link{ color:rgba(0,163,176,.95); text-decoration:none; }
    .link:hover{ text-decoration:underline; }

    @media (max-width: 420px){
      .card{ padding:22px; }
      h1{ font-size:20px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Sign in to InjectBuddy</h1>
          <div class="sub">Save your data and retrieve it on any device. No passwords to remember.</div>
        </div>
      </div>

      <div class="grid">
        <button class="btn" id="google">
          <span>Continue with Google</span>
          <span class="pill">Recommended</span>
        </button>

        <button class="btn" id="facebook">
          <span>Continue with Facebook</span>
          <span class="pill">Fast</span>
        </button>

        <button class="btn" id="discord">
          <span>Continue with Discord</span>
          <span class="pill">Community</span>
        </button>
      </div>

      <div class="status" id="status"></div>

      <div class="footer">
        By continuing, you agree to your account being created in Supabase Auth.
        <a class="link" href="/privacy.html">Privacy</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const statusEl = document.getElementById("status");
    const setStatus = (t) => statusEl.textContent = t || "";

    const supabase = createClient(
      "https://psrtdoglooijxzeyhmpc.supabase.co",
      "sb_publishable_Ta_almUqr3QTPpWQA6Uicw_IYhwLY0S",
      {
        auth: {
          flowType: "pkce",
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    async function oauth(provider) {
      setStatus("Opening sign-in…");

      // Sanity check: can we write storage? PKCE requires it.
      try {
        localStorage.setItem("__ib_test", "1");
        localStorage.removeItem("__ib_test");
      } catch {
        setStatus("Storage blocked in this browser. Disable privacy tools for this site or use Incognito.");
        return;
      }

      await supabase.auth.signInWithOAuth({
        provider,
        options: {
          redirectTo: "https://www.injectbuddy.com/auth/callback.html",
          skipBrowserRedirect: false
        }
      });
    }

    document.getElementById("google").onclick = () => oauth("google");
    document.getElementById("facebook").onclick = () => oauth("facebook");
    document.getElementById("discord").onclick = () => oauth("discord");
  </script>
</body>
</html>
