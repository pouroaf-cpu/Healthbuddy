<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title></head>
<body>
  <h1>Login</h1>
  <button id="google">Continue with Google</button>
  <button id="facebook">Continue with Facebook</button>
  <button id="discord">Continue with Discord</button>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://psrtdoglooijxzeyhmpc.supabase.co",
      "sb_publishable_Ta_almUqr3QTPpWQA6Uicw_IYhwLY0S"
    );

    async function oauth(provider) {
      await supabase.auth.signInWithOAuth({
        provider,
        options: { redirectTo: `${location.origin}/auth/callback.html` }
      });
    }

    document.getElementById("google").onclick = () => oauth("google");
    document.getElementById("facebook").onclick = () => oauth("facebook");
    document.getElementById("discord").onclick = () => oauth("discord");
  </script>
</body>
</html>
