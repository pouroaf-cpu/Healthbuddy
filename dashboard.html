<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard | InjectBuddy</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{--bg:#020617;--card:#0b1220;--border:#1f2937;--text:#e5e7eb;--muted:#94a3b8;--cta:#00a3b0;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text);padding:24px}
    .wrap{max-width:1100px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{margin:0;font-size:22px}
    button{background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer}
    button:hover{border-color:var(--cta)}
    .card{background:linear-gradient(180deg,#0b1220,#070d18);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(15,23,42,.75)}
    .muted{color:var(--muted);font-size:14px;margin-bottom:10px}
    pre{margin:0;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:#cbd5f5}
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Your Dashboard</h1>
      <button id="logout">Log out</button>
    </header>

    <div class="card">
      <div class="muted" id="status">Loading…</div>
      <pre id="out"></pre>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const statusEl = document.getElementById("status");
    const out = document.getElementById("out");

    // ✅ MUST MATCH login.html + callback.html (no custom storageKey)
    const supabase = createClient(
      "https://psrtdoglooijxzeyhmpc.supabase.co",
      "sb_publishable_Ta_almUqr3QTPpWQA6Uicw_IYhwLY0S",
      {
        auth: {
          flowType: "pkce",
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const { data: sessionData } = await supabase.auth.getSession();
    if (!sessionData.session) {
      location.replace("/login.html");
      throw new Error("No session");
    }

    statusEl.textContent = "Signed in. Loading your saved data…";

    const { data, error } = await supabase
      .from("lab_tests")
      .select("id,taken_at,lab_name,notes,lab_markers(*)")
      .order("taken_at", { ascending: false });

    if (error) {
      statusEl.textContent = "Error loading data.";
      out.textContent = error.message;
    } else if (!data || data.length === 0) {
      statusEl.textContent = "No saved lab data yet.";
      out.textContent = "";
    } else {
      statusEl.textContent = "Loaded.";
      out.textContent = JSON.stringify(data, null, 2);
    }

    document.getElementById("logout").onclick = async () => {
      await supabase.auth.signOut();
      location.replace("/login.html");
    };
  </script>
</body>
</html>
