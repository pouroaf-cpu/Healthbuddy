<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title></head>
<body>
  <h1>Your Saved Data</h1>
  <button id="logout">Log out</button>
  <pre id="out">Loading…</pre>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://psrtdoglooijxzeyhmpc.supabase.co",
      "sb_publishable_Ta_almUqr3QTPpWQA6Uicw_IYhwLY0S"
    );

    const out = document.getElementById("out");

    const { data: sessionData } = await supabase.auth.getSession();
    if (!sessionData.session) location.href = "/login.html";

    const { data, error } = await supabase
      .from("lab_tests")
      .select("id,taken_at,lab_name,notes,lab_markers(*)")
      .order("taken_at", { ascending: false });

    out.textContent = error ? ("Error: " + error.message) : JSON.stringify(data, null, 2);

    document.getElementById("logout").onclick = async () => {
      await supabase.auth.signOut();
      location.href = "/login.html";
    };
  </script>
</body>
</html>
