<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InjectBuddy – Testosterone Dosage Calculator</title>

<style>
/* =========================
   BASE
========================= */
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
  background:#020617;
  color:#e5e7eb;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}
h1{font-size:20px;margin:0 0 12px;text-align:center}

/* =========================
   TOGGLES
========================= */
.seg-toggle{
  display:flex;
  border-radius:12px;
  overflow:hidden;
  background:#0b1224;
  border:1px solid rgba(255,255,255,.1);
}
.seg-btn{
  flex:1;
  padding:12px;
  font-weight:800;
  background:rgba(255,255,255,.08);
  border:0;
  color:#f1f5f9;
  cursor:pointer;
}
.seg-btn[aria-checked="true"]{
  background:linear-gradient(180deg,#37fbff,#00b2b5);
  color:#021014;
}

/* =========================
   SLIDERS
========================= */
.range-wrap{
  margin:14px 0;
}
label{
  display:flex;
  justify-content:space-between;
  font-weight:700;
}
input[type=number]{
  width:90px;
  background:#020617;
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  border-radius:8px;
  padding:4px 6px;
  font-weight:700;
}
input[type=range]{
  width:100%;
  margin-top:10px;
  -webkit-appearance:none;
  appearance:none;
  height:10px;
  border-radius:999px;
  background:#111827;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#00b2b5;
  border:3px solid #020617;
}
input[type=range]::-moz-range-thumb{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#00b2b5;
  border:3px solid #020617;
}

/* =========================
   KPI
========================= */
.kpi-toggle{
  margin-top:16px;
  width:100%;
  padding:10px;
  font-weight:800;
  background:#0b1224;
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  cursor:pointer;
}
.kpi-panel{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.card{
  background:#0b1224;
  border:1px solid rgba(255,255,255,.1);
  padding:10px;
  border-radius:10px;
}
.muted{color:#9ca3af;font-size:13px}
.warn{
  margin-top:10px;
  background:#fff7ed;
  color:#9a3412;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">
<h1>Testosterone Dosage Calculator</h1>

<!-- MODE -->
<div class="seg-toggle" id="modeToggle">
  <button class="seg-btn" data-mode="perWeek" aria-checked="false">Per week</button>
  <button class="seg-btn" data-mode="everyNDays" aria-checked="true">Inject X days</button>
  <button class="seg-btn" data-mode="mlToMg" aria-checked="false">mL → mg</button>
</div>

<!-- SYRINGE -->
<div class="seg-toggle" id="syringeToggle" style="margin-top:12px">
  <button class="seg-btn" data-ml="3" aria-checked="false">3 mL</button>
  <button class="seg-btn" data-ml="1" aria-checked="true">1 mL</button>
  <button class="seg-btn" data-ml="0.5" aria-checked="false">0.5 mL</button>
  <button class="seg-btn" data-ml="0.3" aria-checked="false">0.3 mL</button>
</div>

<!-- CONCENTRATION -->
<div class="range-wrap">
<label>Vial strength (mg/mL)
<input type="number" id="lr-conc"></label>
<input type="range" id="conc-slider" min="50" max="400" step="5">
</div>

<!-- WEEKLY -->
<div class="range-wrap" id="weekly-wrap">
<label>Total mg per week
<input type="number" id="lr-weekly"></label>
<input type="range" id="weekly-slider">
</div>

<!-- EVERY N DAYS -->
<div class="range-wrap" id="everyNdaysWrap">
<label>Every N days
<input type="number" id="lr-ndays"></label>
<input type="range" id="ndays-slider" min="1" max="14" step="1">
</div>

<!-- ML TO MG -->
<div class="range-wrap" id="mlVolumeWrap" hidden>
<label>Volume injected (mL)
<input type="number" id="lr-ml"></label>
<input type="range" id="ml-slider" min="0" max="3" step="0.1">
</div>

<!-- KPI -->
<button class="kpi-toggle" aria-expanded="false">Dose breakdown</button>
<div class="kpi-panel" hidden>
  <div class="card"><div class="muted">Injections / week</div><b id="kpi_inj">—</b></div>
  <div class="card"><div class="muted">Dose / injection</div><b id="kpi_dose">—</b></div>
  <div class="card"><div class="muted">Volume / injection</div><b id="kpi_ml">—</b></div>
</div>

<div class="warn" id="warn" hidden></div>
</div>

<script>
const DEFAULTS={mode:'everyNDays',syringe:1,weekly:180,conc:250,ndays:2};
const WEEKLY=[...Array(97)].map((_,i)=>20+i*5);
const $=id=>document.getElementById(id);
let mode=DEFAULTS.mode;
let syringe=DEFAULTS.syringe;

function setMode(m){
  mode=m;
  document.querySelectorAll('#modeToggle .seg-btn')
    .forEach(b=>b.setAttribute('aria-checked',b.dataset.mode===m));
  $('weekly-wrap').hidden=(m==='mlToMg');
  $('everyNdaysWrap').hidden=(m!=='everyNDays');
  $('mlVolumeWrap').hidden=(m!=='mlToMg');
  calc();
}
function setSyringe(v){
  syringe=v;
  document.querySelectorAll('#syringeToggle .seg-btn')
    .forEach(b=>b.setAttribute('aria-checked',Number(b.dataset.ml)===v));
  calc();
}
function calc(){
  const conc=+$('conc-slider').value;
  let vol=0,dose=0,inj=0;
  const weekly=WEEKLY[+$('weekly-slider').value];

  if(mode==='everyNDays'){
    const n=+$('ndays-slider').value;
    inj=7/n;
    dose=(weekly*n)/7;
    vol=dose/conc;
  }
  if(mode==='perWeek'){
    inj=2;
    dose=weekly/inj;
    vol=dose/conc;
  }
  if(mode==='mlToMg'){
    vol=+$('ml-slider').value;
    dose=vol*conc;
    inj=1;
  }

  $('kpi_inj').textContent=inj.toFixed(2);
  $('kpi_dose').textContent=dose.toFixed(2)+' mg';
  $('kpi_ml').textContent=vol.toFixed(3)+' mL';

  $('warn').hidden=!(vol>syringe);
  $('warn').textContent='Volume exceeds syringe capacity.';
}

document.addEventListener('DOMContentLoaded',()=>{
  $('conc-slider').value=DEFAULTS.conc;
  $('lr-conc').value=DEFAULTS.conc;
  $('ndays-slider').value=DEFAULTS.ndays;
  $('lr-ndays').value=DEFAULTS.ndays;
  $('weekly-slider').min=0;
  $('weekly-slider').max=WEEKLY.length-1;
  $('weekly-slider').value=WEEKLY.indexOf(DEFAULTS.weekly);
  $('lr-weekly').value=DEFAULTS.weekly;

  document.querySelectorAll('input').forEach(i=>{
    i.addEventListener('input',()=>{ 
      if(i.type==='range'&&$('lr-'+i.id.replace('-slider','')))
        $('lr-'+i.id.replace('-slider','')).value=i.value;
      calc();
    });
  });

  $('modeToggle').onclick=e=>e.target.dataset.mode&&setMode(e.target.dataset.mode);
  $('syringeToggle').onclick=e=>e.target.dataset.ml&&setSyringe(Number(e.target.dataset.ml));

  document.querySelector('.kpi-toggle').onclick=()=>{
    const p=document.querySelector('.kpi-panel');
    p.hidden=!p.hidden;
  };

  setMode(DEFAULTS.mode);
  setSyringe(DEFAULTS.syringe);
});
</script>
</body>
</html>
