<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4EGGZW9P14"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4EGGZW9P14');
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Peptide Dosage Calculator | InjectBuddy</title>
  <meta name="description" content="Plan peptide reconstitution and dosing with syringe visuals and per-injection breakdowns." />
  <link rel="canonical" href="https://www.injectbuddy.com/peptide.html" />
  <link rel="icon" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />

<style>
:root{
  --bg:#020617;
  --ink:#e5e7eb;
  --muted:#9ca3af;
  --card:#0b1224;
  --cta:#00b2b5;
  --ring:rgba(0,199,202,.55);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,Arial;
}

.container{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}

h1{
  font-size:16px;
  font-weight:700;
  margin:0 0 12px;
}

.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:14px;
}

.calc-wrap{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:24px;
}
@media(max-width:900px){
  .calc-wrap{grid-template-columns:1fr}
}

.full{
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-areas:
    "label chip"
    "slider slider";
  gap:6px 12px;
}
.full label{font-weight:700}
.live-chip{
  padding:4px 8px;
  background:#020617;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  border:1px solid rgba(255,255,255,.1);
}

input[type=range]{
  grid-area:slider;
  width:100%;
  height:8px;
  border-radius:999px;
  background:#111827;
}
input[type=range]::-webkit-slider-thumb{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--cta);
  -webkit-appearance:none;
}

.kpis{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.kpis .card b{font-size:16px}

footer{
  margin-top:30px;
  border-top:1px solid #1f2937;
  padding:12px 0;
  color:var(--muted);
  font-size:14px;
}
</style>
</head>

<body>
<div id="site-header"></div>

<main class="container">
  <h1>Peptide Dosage & Reconstitution</h1>

  <section class="card">
    <div class="calc-wrap">

      <!-- LEFT -->
      <div class="calc-grid">

        <div class="full">
          <label>Peptide in vial (mg)</label>
          <div class="live-chip" id="lr-mg">5 mg</div>
          <input id="pepMg" type="range" min="0.5" max="20" step="0.5" value="5">
        </div>

        <div class="full">
          <label>Bacteriostatic water (mL)</label>
          <div class="live-chip" id="lr-ml">2 mL</div>
          <input id="bacMl" type="range" min="1" max="30" step="1" value="2">
        </div>

        <div class="full">
          <label>Total per week (mg)</label>
          <div class="live-chip" id="lr-weekly">1 mg</div>
          <input id="weeklyMg" type="range" min="0.5" max="10" step="0.1" value="1">
        </div>

        <div class="full">
          <label>Injections per week</label>
          <div class="live-chip" id="lr-inj">3</div>
          <input id="injCount" type="range" min="1" max="7" step="1" value="3">
        </div>

      </div>

      <!-- RIGHT -->
      <div class="kpis">
        <div class="card">
          <span class="muted">Vial strength</span><br>
          <b id="kStrength">— mg/mL</b>
        </div>
        <div class="card">
          <span class="muted">Dose per injection</span><br>
          <b id="kDoseMg">— mg</b><br>
          <span class="muted" id="kDoseMl">— mL</span>
        </div>
      </div>

    </div>
  </section>
</main>

<footer>
  <div class="container">
    © <span id="y"></span> InjectBuddy · Planning only
  </div>
</footer>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toFixed(2).replace(/\.?0+$/,'');

function calc(){
  const mg=+$('pepMg').value;
  const ml=+$('bacMl').value;
  const wk=+$('weeklyMg').value;
  const inj=+$('injCount').value;

  $('lr-mg').textContent=`${mg} mg`;
  $('lr-ml').textContent=`${ml} mL`;
  $('lr-weekly').textContent=`${wk} mg`;
  $('lr-inj').textContent=inj;

  const strength=mg/ml;
  const doseMg=wk/inj;
  const doseMl=doseMg/strength;

  $('kStrength').textContent=`${fmt(strength)} mg/mL`;
  $('kDoseMg').textContent=`${fmt(doseMg)} mg`;
  $('kDoseMl').textContent=`${fmt(doseMl)} mL`;
}

['pepMg','bacMl','weeklyMg','injCount'].forEach(id=>{
  $(id).addEventListener('input',calc);
});

$('y').textContent=new Date().getFullYear();
calc();
</script>

<script src="/assets/nav.js" defer></script>
</body>
</html>
