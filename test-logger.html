<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InjectBuddy — Test Logger</title>
<meta name="description" content="Secure TRT and blood test logger powered by Supabase." />
<link rel="icon" href="/assets/favicon.svg" />
<style>
  :root {
    --teal: #009395;
    --dark: #004c4d;
    --bg: #f3fbfb;
    --muted: #e1eeee;
    --card: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: #1b2424;
  }
  button {
    border: none;
    background: var(--teal);
    color: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 1rem;
  }
  button.ghost {
    background: transparent;
    color: var(--dark);
    border: 1px solid var(--muted);
  }
  button.danger { background: #c0392b; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--muted);
    border-radius: 8px;
    background: #fff;
    font-size: 1rem;
  }
  label { font-size: 0.9rem; color: #2d3c3c; }
  .hide { display: none !important; }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card {
    background: var(--card);
    border: 1px solid var(--muted);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    margin: 12px 0;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border-bottom: 1px solid var(--muted);
    padding: 8px;
    text-align: left;
  }
  .hint { font-size: 0.9rem; color: #566; }
  /* ===== Centered Auth ===== */
  .auth-shell {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #f6fbfb, #eef7f7);
    padding: 20px;
  }
  .auth-card {
    background: #fff;
    border: 1px solid var(--muted);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
  }
  .logo { font-weight: 700; color: var(--dark); font-size: 1.1rem; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
  }
</style>
<script src="https://unpkg.com/@supabase/supabase-js@2.46.1/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- HEADER -->
<div class="wrap hide" id="topWrap">
  <header>
    <div class="logo">InjectBuddy — Test Logger</div>
    <div class="row">
      <span id="userEmail" class="hint"></span>
      <button id="btnSignOut" class="ghost">Sign out</button>
    </div>
  </header>
</div>

<!-- AUTH -->
<section id="authShell" class="auth-shell">
  <div class="auth-card">
    <h2 style="margin:0;color:var(--dark)">Welcome to InjectBuddy</h2>
    <p class="hint">Create an account or sign in to track your bloodwork securely.</p>

    <div class="row" style="margin:10px 0;">
      <button id="btnGoogle" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42v-.1H24v7.2h11.3C33.5 31.8 29.2 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.1-5.1C33.4 5.4 28.9 3.5 24 3.5 12.1 3.5 2.5 13.1 2.5 25S12.1 46.5 24 46.5 45.5 36.9 45.5 25c0-1.5-.2-3-.6-4.5z"/></svg>
        Continue with Google
      </button>
    </div>

    <p class="hint" style="margin:8px 0;text-align:center;">or sign in with email</p>
    <input id="email" type="email" placeholder="you@example.com" />
    <input id="password" type="password" placeholder="Password" style="margin-top:8px;" />
    <div class="row" style="margin-top:8px;">
      <button id="btnLogin" style="flex:1;">Log in</button>
      <button id="btnSignup" class="ghost">Sign up</button>
    </div>
    <p class="hint" style="margin:10px 0;">Need a passwordless link?</p>
    <div class="row">
      <input id="magicEmail" type="email" placeholder="you@example.com" />
      <button id="btnMagic">Send link</button>
    </div>
  </div>
</section>

<!-- APP -->
<div class="wrap hide" id="appWrap">
  <div class="card">
    <h3>New Lab Test</h3>
    <div class="grid grid-2">
      <div>
        <label>Date taken</label>
        <input id="takenAt" type="date" />
      </div>
      <div>
        <label>Lab name</label>
        <input id="labName" placeholder="Pathlab" />
      </div>
    </div>
    <div style="margin-top:8px">
      <label>Notes</label>
      <textarea id="notes" rows="2" placeholder="Fasted? Protocol changes?"></textarea>
    </div>
    <details style="margin-top:10px">
      <summary>Quick markers (optional)</summary>
      <div class="grid grid-2" style="margin-top:10px">
        <div><label>Total T (nmol/L)</label><input id="m_total_t" type="number" /></div>
        <div><label>Free T (pmol/L)</label><input id="m_free_t" type="number" /></div>
        <div><label>E2 (pmol/L)</label><input id="m_e2" type="number" /></div>
        <div><label>SHBG (nmol/L)</label><input id="m_shbg" type="number" /></div>
        <div><label>Hematocrit (%)</label><input id="m_hct" type="number" /></div>
      </div>
    </details>
    <div class="row" style="margin-top:12px">
      <button id="btnSave">Save test</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <h3 style="margin:0">My Lab Tests</h3>
      <button id="btnExport" class="ghost" style="margin-left:auto;">Export CSV</button>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Lab</th><th>Markers</th><th></th></tr></thead>
      <tbody id="testsBody"><tr><td colspan="4" class="hint">No data</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://psrtdoglooijxzeyhmpc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzcnRkb2dsb29panh6ZXlobXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0NDc5NzgsImV4cCI6MjA3NjAyMzk3OH0.9rJpPsw9jueVW8OTqE_2dnCNj-LcO3yvwszhw_OqYUQ';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const authShell = document.getElementById('authShell');
const topWrap = document.getElementById('topWrap');
const appWrap = document.getElementById('appWrap');
const userEmail = document.getElementById('userEmail');
const btnSignOut = document.getElementById('btnSignOut');
const btnGoogle = document.getElementById('btnGoogle');
const email = document.getElementById('email');
const password = document.getElementById('password');
const btnLogin = document.getElementById('btnLogin');
const btnSignup = document.getElementById('btnSignup');
const magicEmail = document.getElementById('magicEmail');
const btnMagic = document.getElementById('btnMagic');
const takenAt = document.getElementById('takenAt');
const labName = document.getElementById('labName');
const notes = document.getElementById('notes');
const quick = {
  total_t: document.getElementById('m_total_t'),
  free_t: document.getElementById('m_free_t'),
  e2: document.getElementById('m_e2'),
  shbg: document.getElementById('m_shbg'),
  hct: document.getElementById('m_hct'),
};
const btnSave = document.getElementById('btnSave');
const testsBody = document.getElementById('testsBody');
const btnExport = document.getElementById('btnExport');

let currentUser = null;

function setAuthedUI(on){
  if(on){
    authShell.classList.add('hide');
    topWrap.classList.remove('hide');
    appWrap.classList.remove('hide');
  } else {
    authShell.classList.remove('hide');
    topWrap.classList.add('hide');
    appWrap.classList.add('hide');
  }
}

async function refreshAuth(){
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  if(user){
    userEmail.textContent = user.email ?? 'Signed in';
    setAuthedUI(true);
    await loadTests();
  } else {
    setAuthedUI(false);
  }
}

btnGoogle.onclick = async () => {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: 'https://psrtdoglooijxzeyhmpc.supabase.co/auth/v1/callback' }
  });
};

btnLogin.onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: email.value, password: password.value });
  if(error) alert(error.message); else await refreshAuth();
};

btnSignup.onclick = async () => {
  const { error } = await sb.auth.signUp({
    email: email.value,
    password: password.value,
    options: { emailRedirectTo: window.location.origin }
  });
  if(error) alert(error.message); else alert('Check your email to confirm your account.');
};

btnMagic.onclick = async () => {
  const { error } = await sb.auth.signInWithOtp({ email: magicEmail.value });
  if(error) alert(error.message); else alert('Magic link sent.');
};

btnSignOut.onclick = async () => { await sb.auth.signOut(); setAuthedUI(false); };

/* --- CRUD --- */
async function loadTests(){
  if(!currentUser) return;
  const { data } = await sb.from('lab_tests')
    .select('id,taken_at,lab_name,lab_markers(count)')
    .eq('user_id', currentUser.id).order('taken_at',{ascending:false});
  testsBody.innerHTML = '';
  if(!data?.length){ testsBody.innerHTML='<tr><td colspan="4" class="hint">No data</td></tr>'; return; }
  data.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.taken_at}</td><td>${r.lab_name??'-'}</td><td>${r.lab_markers[0]?.count??0}</td><td></td>`;
    testsBody.appendChild(tr);
  });
}

btnSave.onclick = async () => {
  if(!currentUser) return alert('Please log in first');
  const d = takenAt.value || new Date().toISOString().slice(0,10);
  const { data, error } = await sb.from('lab_tests').insert({ user_id: currentUser.id, taken_at: d, lab_name: labName.value, notes: notes.value }).select().single();
  if(error) return alert(error.message);
  const t = data.id;
  const q = [];
  const defs = [['total_t','Total Testosterone','nmol/L',quick.total_t.value],['free_t','Free Testosterone','pmol/L',quick.free_t.value],['e2','Estradiol','pmol/L',quick.e2.value],['shbg','SHBG','nmol/L',quick.shbg.value],['hct','Hematocrit','%',quick.hct.value]];
  defs.forEach(([c,l,u,v])=>{if(v)q.push({lab_test_id:t,marker_code:c,marker_label:l,value_numeric:Number(v),unit:u});});
  if(q.length) await sb.from('lab_markers').insert(q);
  await loadTests();
};

btnExport.onclick = async ()=>{
  if(!currentUser) return;
  const { data } = await sb.from('lab_tests').select('id,taken_at,lab_name,notes,lab_markers(*)').eq('user_id', currentUser.id);
  if(!data?.length) return alert('No data');
  let csv='date,lab,marker,value,unit,ref_low,ref_high,notes\n';
  data.forEach(t=>{
    (t.lab_markers||[]).forEach(m=>{
      csv+=`${t.taken_at},${t.lab_name??''},${m.marker_label},${m.value_numeric??''},${m.unit??''},${m.ref_low??''},${m.ref_high??''},${t.notes??''}\n`;
    });
  });
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='injectbuddy-tests.csv';a.click();URL.revokeObjectURL(a.href);
};

refreshAuth();
sb.auth.onAuthStateChange(()=>refreshAuth());
</script>
</body>
</html>
